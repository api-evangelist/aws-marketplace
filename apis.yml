aid: aws-marketplace

name: AWS Marketplace

description: >-
  AWS Marketplace is a curated digital catalog from Amazon Web Services that lets customers find, buy,
  deploy, and manage third-party software, SaaS, containers, machine images (AMIs), data products, and
  professional services that run on AWS. It is an AWS product, not a separate API provider: its APIs
  (Marketplace Catalog, Metering Service, Entitlement Service, Commerce Analytics, Agreement and
  Deployment) are profiled in the amazon-web-services repository, which is canonical. Consolidated
  2026-10-13, approved by Kin Lane.

